name: SST Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  executar-radar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar SST Radar
        run: |
          python radar.py

      - name: Salvar histórico
        run: |
          git config user.name "SST Radar"
          git config user.email "sst-radar@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "Atualiza histórico do SST Radar"
          git push

      - name: Testar DOU
        run: |
          python dou.py

      - name: Gerar relatório SST
        run: |
          python relatorio.py

      - name: Salvar relatório
        run: |
          git add relatorio_sst.md
          git diff --cached --quiet || git commit -m "Atualiza relatório SST"
          git push
