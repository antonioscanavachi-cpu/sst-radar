name: SST Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  executar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar SST Radar
        run: python radar.py
